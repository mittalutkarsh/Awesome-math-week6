td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: count, don&#x27;t measure.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c7": "<h2>Where can x sit?<\/h2><div class=\"eq\" role=\"math\">one line per gap \u2192 solve \u2192 keep x only if it lands in its own gap<\/div><p class=\"idea\">When the middle box depends on x, split into cases by where x sits, solve each, and keep x only if it really lands there.<\/p><div class=\"story concept\" id=\"story15\" tabindex=\"0\" aria-label=\"Where can x sit? story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 244 104\" role=\"img\" aria-label=\"where x could go\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"36\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"64\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"96\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"36\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"64\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"96\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"36\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"64\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><text x=\"149.0\" y=\"96\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"36\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"64\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"207.0\" y=\"96\" class=\"posn\" text-anchor=\"middle\">4<\/text><path d=\"M-2.0 22 L10.0 22 L4.0 33 Z\" class=\"gaparrow\"/><path d=\"M56.0 22 L68.0 22 L62.0 33 Z\" class=\"gaparrow\"/><path d=\"M114.0 22 L126.0 22 L120.0 33 Z\" class=\"gaparrow\"/><path d=\"M172.0 22 L184.0 22 L178.0 33 Z\" class=\"gaparrow\"/><path d=\"M230.0 22 L242.0 22 L236.0 33 Z\" class=\"gaparrow\"/><\/svg><\/div><figcaption><p>2, 4, 8, 12 and one more number x have equal mean and median. The arrows show every gap x could slide into.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 302 90\" role=\"img\" aria-label=\"x in the middle\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">x<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"tempting\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">only x = 6.5?<\/text><line x1=\"14\" y1=\"42\" x2=\"246\" y2=\"14\" class=\"strike banned big\"/><\/svg><\/div><\/div><figcaption><p>Tempting: put x in the middle. That gives x = 6.5, but x might not be in the middle at all.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 416 90\" role=\"img\" aria-label=\"clues\" style=\"max-width:603px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"84\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"370.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">26 + x<\/text><text x=\"370.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Clues as slot facts: Total 26 + x, so the mean is (26 + x) \u00f7 5; five boxes, so the median is box 3.<\/p><div class=\"ask\"><b>Ask him:<\/b> Which number sits in box 3? Does it depend on x?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><div class=\"cases\"><div class=\"case\"><div class=\"casehead\">x at the bottom (x \u2264 4)<\/div><svg class=\"pic \" viewBox=\"0 0 302 74\" role=\"img\" aria-label=\"case 1\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">x<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><\/svg><div class=\"caseverdict ok\">\u2713 box 3 = 4 \u2192 Total 20 \u2192 x = \u22126 (\u22126 \u2264 4)<\/div><\/div><div class=\"case\"><div class=\"casehead\">x in the middle (4 \u2264 x \u2264 8)<\/div><svg class=\"pic \" viewBox=\"0 0 302 74\" role=\"img\" aria-label=\"case 2\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">x<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><\/svg><div class=\"caseverdict ok\">\u2713 box 3 = x \u2192 26 + x = 5x \u2192 x = 6.5<\/div><\/div><div class=\"case\"><div class=\"casehead\">x at the top (x \u2265 8)<\/div><svg class=\"pic \" viewBox=\"0 0 302 74\" role=\"img\" aria-label=\"case 3\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">x<\/text><\/svg><div class=\"caseverdict ok\">\u2713 box 3 = 8 \u2192 Total 40 \u2192 x = 14 (14 \u2265 8)<\/div><\/div><\/div><\/div><figcaption><p>One line per place x can sit. Each case gives one x, and each lands in its own gap.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>line<\/th><th>mean<\/th><th>median<\/th><\/tr><\/thead><tbody><tr><td>\u22126, 2, 4, 8, 12<\/td><td>20 \u00f7 5 = 4<\/td><td>4<\/td><\/tr><tr><td>2, 4, 6.5, 8, 12<\/td><td>32.5 \u00f7 5 = 6.5<\/td><td>6.5<\/td><\/tr><tr><td>2, 4, 8, 12, 14<\/td><td>40 \u00f7 5 = 8<\/td><td>8<\/td><\/tr><tr class=\"hl\"><td>2, 4, 5, 8, 12<\/td><td>?<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Check each finished line: mean and median agree three times. Fill the last row to see a place that fails. Rule: one line per gap, solve, then check that x really sits in its gap.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c8": "<h2>Blocks of boxes<\/h2><div class=\"eq\" role=\"math\">combined mean = <span class=\"frac\"><span>n\u2081 \u00d7 m\u2081 + n\u2082 \u00d7 m\u2082<\/span><span>n\u2081 + n\u2082<\/span><\/span><\/div><p class=\"idea\">Equal values form blocks; total each block, then divide by all the boxes, not by the number of blocks.<\/p><div class=\"story concept\" id=\"story16\" tabindex=\"0\" aria-label=\"Blocks of boxes story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 244 90\" role=\"img\" aria-label=\"four scores\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">70<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><\/svg><\/div><figcaption><p>Three kids scored 90 and one scored 70. What is the mean of all four?<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 306 92\" role=\"img\" aria-label=\"tempting wrong answer\" style=\"max-width:444px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"187\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"103.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(90 + 70) \u00f7 2<\/text><text x=\"220.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"244\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"266.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">80<\/text><line x1=\"6\" y1=\"60\" x2=\"300\" y2=\"12\" class=\"strike banned big\"/><text x=\"153.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">treats a group of 3 and a group of 1 as the same size<\/text><\/svg><\/div><figcaption><p>Tempting: average the two scores, 80. That gives the one kid as much say as the three kids together.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 480 104\" role=\"img\" aria-label=\"blocks\" style=\"max-width:696px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"14.0\" y=\"30\" width=\"44.333333333333336\" height=\"26\" rx=\"3\" class=\"slot\"/><text x=\"36.16666666666667\" y=\"47\" class=\"tinyn\" text-anchor=\"middle\">90<\/text><rect x=\"61.333333333333336\" y=\"30\" width=\"44.333333333333336\" height=\"26\" rx=\"3\" class=\"slot\"/><text x=\"83.5\" y=\"47\" class=\"tinyn\" text-anchor=\"middle\">90<\/text><rect x=\"108.66666666666667\" y=\"30\" width=\"44.333333333333336\" height=\"26\" rx=\"3\" class=\"slot\"/><text x=\"130.83333333333334\" y=\"47\" class=\"tinyn\" text-anchor=\"middle\">90<\/text><rect x=\"10\" y=\"24\" width=\"150\" height=\"38\" rx=\"7\" class=\"blockout\"/><text x=\"85.0\" y=\"16\" class=\"cap\" text-anchor=\"middle\">block A: 3 \u00d7 90<\/text><text x=\"85.0\" y=\"84\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">270<\/text><text x=\"175\" y=\"48\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"194.0\" y=\"30\" width=\"139.0\" height=\"26\" rx=\"3\" class=\"slot\"/><text x=\"263.5\" y=\"47\" class=\"tinyn\" text-anchor=\"middle\">70<\/text><rect x=\"190\" y=\"24\" width=\"150\" height=\"38\" rx=\"7\" class=\"blockout\"/><text x=\"265.0\" y=\"16\" class=\"cap\" text-anchor=\"middle\">block B: 1 \u00d7 70<\/text><text x=\"265.0\" y=\"84\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">70<\/text><text x=\"364\" y=\"48\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"378\" y=\"24\" width=\"84\" height=\"38\" rx=\"7\" class=\"result\"/><text x=\"420\" y=\"49\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">340<\/text><text x=\"420\" y=\"84\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Total each block: 3 \u00d7 90 = 270 and 1 \u00d7 70 = 70. The Total box holds 340.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 418 90\" role=\"img\" aria-label=\"divide by boxes\" style=\"max-width:606px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">70<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">90<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><text x=\"253\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"270\" y=\"22\" width=\"144\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"342.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">340 \u00f7 4 = 85<\/text><text x=\"342.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Divide by the four boxes, not the two blocks: 85.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why is 85 closer to 90 than to 70?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 460 130\" role=\"img\" aria-label=\"balance\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"14\" y1=\"76\" x2=\"446\" y2=\"76\" class=\"beamline\"/><path d=\"M286.0 102 L310.0 102 L298.0 78 Z\" class=\"pivot\"/><text x=\"298.0\" y=\"118\" class=\"cap\" text-anchor=\"middle\">mean 85<\/text><circle cx=\"94.0\" cy=\"66\" r=\"6\" class=\"dot\"/><text x=\"94.0\" y=\"94\" class=\"dotlab\" text-anchor=\"middle\">70<\/text><text x=\"94.0\" y=\"54\" class=\"bracet\" text-anchor=\"middle\">\u221215<\/text><circle cx=\"366.0\" cy=\"66\" r=\"6\" class=\"dot\"/><circle cx=\"366.0\" cy=\"52\" r=\"6\" class=\"dot\"/><circle cx=\"366.0\" cy=\"38\" r=\"6\" class=\"dot\"/><text x=\"366.0\" y=\"94\" class=\"dotlab\" text-anchor=\"middle\">90<\/text><text x=\"366.0\" y=\"26\" class=\"bracet\" text-anchor=\"middle\">+5 (\u00d73)<\/text><\/svg><\/div><figcaption><p>The balance check: the 70 is 15 below 85; the three 90s are 5 above each, 15 in all. Below and above cancel.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 449 70\" role=\"img\" aria-label=\"scale\" style=\"max-width:651px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"330\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"175.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(30 \u00d7 90 + 10 \u00d7 70) \u00f7 40<\/text><text x=\"363.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"387\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"409.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">85<\/text><\/svg><\/div><figcaption><p>Only the 3 : 1 matters. 30 kids and 10 kids give the same 85, so you can pick a small representative group.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>block sizes<\/th><th>block means<\/th><th>combined<\/th><\/tr><\/thead><tbody><tr><td>3 and 1<\/td><td>90 and 70<\/td><td>85<\/td><\/tr><tr><td>1 and 1<\/td><td>90 and 70<\/td><td>80<\/td><\/tr><tr class=\"hl\"><td>2 and 3<\/td><td>80 and 60<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: blocks \u2192 block totals \u2192 one Total \u2192 divide by every box.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>"}}</script>

<script>
/* Answer checker. Parses numbers and expressions exactly (BigInt rationals), so 2^5*20*49*47*46,
   11!/(4!4!2!), 3×2⁹, 10 choose 3, C(10,3), 10C3 and "1,260" all work. */
window.CHECK = (function () {
  "use strict";
  function gcd(a, b) { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) { [a, b] = [b, a % b]; } return a; }
  function R(n, d) { d = d === undefined ? 1n : d; if (d === 0n) throw new Error("divide by zero"); if (d < 0n) { n = -n; d = -d; } const g = gcd(n, d) || 1n; return { n: n / g, d: d / g }; }
  const add = (a, b) => R(a.n * b.d + b.n * a.d, a.d * b.d);
  const sub = (a, b) => R(a.n * b.d - b.n * a.d, a.d * b.d);
  const mul = (a, b) => R(a.n * b.n, a.d * b.d);
  const div = (a, b) => R(a.n * b.d, a.d * b.n);
  const isInt = (a) => a.d === 1n;
  function fact(a) { if (!isInt(a) || a.n < 0n || a.n > 300n) throw new Error("factorial"); let r = 1n; for (let i = 2n; i <= a.n; i++) r *= i; return R(r); }
  function pow(a, b) {
    if (!isInt(b) || b.n < 0n || b.n > 2000n) throw new Error("power");
    let r = 1n, rd = 1n; for (let i = 0n; i < b.n; i++) { r *= a.n; rd *= a.d; } return R(r, rd);
  }
  function choose(n, k) {
    if (!isInt(n) || !isInt(k) || k.n < 0n || n.n < 0n) throw new Error("choose");
    if (k.n > n.n) return R(0n);
    return div(fact(n), mul(fact(k), fact(R(n.n - k.n))));
  }

  const SUP = { "⁰": "0", "¹": "1", "²": "2", "³": "3", "⁴": "4", "⁵": "5", "⁶": "6", "⁷": "7", "⁸": "8", "⁹": "9" };
  const UNITS = /\s*(years?( old)?|points?|beans?|doctors?|lawyers?|values?|terms?|ways?|paths?|teams?|players?|students?|games?|diagonals?|segments?|triangles?|parallelograms?|handfuls?|stacks?|arrangements?|combinations?|groups?|kids?|numbers?|options?|possibilities|jobs?|candies|cookies|marbles?)\.?\s*$/;
  function normalize(s) {
    s = String(s).trim().toLowerCase();
    s = s.replace(/[\u2212\u2013\u2014]/g, "-");
    s = s.replace(/[×✕✖·⋅∙•]/g, "*").replace(/÷/g, "/");
    s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g, (m) => "^" + [...m].map((c) => SUP[c]).join(""));
    s = s.replace(UNITS, "");
    s = s.replace(/^[a-z]\s*=\s*/, "");          // "n = 13"
    s = s.replace(/^(\d+)\s*:\s*(\d+)$/, "$1/$2");  // ratio 2:1
    s = s.replace(/(^|[^\d.])(\d+)\s+(\d+)\s*\/\s*(\d+)/g, "$1($2+$3/$4)"); // mixed number 33 1/21
    s = s.replace(/(\d),(?=\d{3}(?!\d))/g, "$1");  // thousands commas
    s = s.replace(/(\d)\s+(?=\d{3}(?!\d))/g, "$1"); // "67 800 320"
    s = s.replace(/(\d+)\s*choose\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d+)\s*c\s*(\d+)/g, "c($1,$2)");
    s = s.replace(/(\d|\))\s*x\s*(?=[\d(c])/g, "$1*");
    return s;
  }
  function tokenize(s) {
    const t = []; let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (/\s/.test(ch)) { i++; continue; }
      if (/[0-9.]/.test(ch)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; t.push({ k: "num", v: s.slice(i, j) }); i = j; continue; }
      if (ch === "c" && s[i + 1] === "(") { t.push({ k: "C" }); i++; continue; }
      if ("+-*/^!(),".includes(ch)) { t.push({ k: ch }); i++; continue; }
      throw new Error("bad char " + ch);
    }
    return t;
  }
  function parseNum(v) {
    if ((v.match(/\./g) || []).length > 1) throw new Error("num");
    if (v.includes(".")) { const [a, b] = v.split("."); return R(BigInt((a || "0") + b), 10n ** BigInt(b.length)); }
    return R(BigInt(v));
  }
  function evaluate(src) {
    const t = tokenize(normalize(src)); let p = 0;
    const peek = () => t[p], eat = (k) => { if (!t[p] || t[p].k !== k) throw new Error("expected " + k); return t[p++]; };
    let ops = 0;
    function expr() { let a = term(); while (peek() && (peek().k === "+" || peek().k === "-")) { const o = t[p++].k; ops++; const b = term(); a = o === "+" ? add(a, b) : sub(a, b); } return a; }
    function startsFactor(tk) { return tk && (tk.k === "num" || tk.k === "(" || tk.k === "C"); }
    function term() {
      let a = power();
      for (;;) {
        const tk = peek();
        if (tk && (tk.k === "*" || tk.k === "/")) { p++; ops++; const b = power(); a = tk.k === "*" ? mul(a, b) : div(a, b); }
        else if (startsFactor(tk)) { ops++; a = mul(a, power()); }
        else break;
      }
      return a;
    }
    function power() { const a = unary(); if (peek() && peek().k === "^") { p++; ops++; return pow(a, power()); } return a; }
    function unary() { if (peek() && peek().k === "-") { p++; return sub(R(0n), unary()); } return post(); }
    function post() { let a = prim(); while (peek() && peek().k === "!") { p++; ops++; a = fact(a); } return a; }
    function prim() {
      const tk = peek(); if (!tk) throw new Error("end");
      if (tk.k === "num") { p++; return parseNum(tk.v); }
      if (tk.k === "(") { p++; const a = expr(); eat(")"); return a; }
      if (tk.k === "C") { p++; eat("("); const n = expr(); eat(","); const k = expr(); eat(")"); ops++; return choose(n, k); }
      throw new Error("unexpected " + tk.k);
    }
    const v = expr(); if (p !== t.length) throw new Error("trailing");
    return { v, ops };
  }
  function tryEval(s) { try { return evaluate(s); } catch (e) { return null; } }
  const show = (r) => (r.d === 1n ? r.n.toLocaleString("en-US") : r.n + "/" + r.d);
  const big = (x) => { const e = tryEval(String(x)); if (!e) throw new Error("bad answer " + x); return e.v; };
  function splitList(s) {
    let n = normalize(s).replace(/\band\b|&|;/g, ",");
    const parts = n.split(/\s*,\s*|\s+/).filter(Boolean);
    return parts;
  }

  /* grade(step, input, others) -> {ok, msg, kind, value} ; others = answers of the problem's other steps (by number) */
  function grade(step, input, others) {
    others = others || [];
    const raw = String(input || "").trim();
    if (!raw) return { ok: false, kind: "empty", msg: "Type an answer first." };
    const type = step.type;
    if (type === "yn") {
      const y = /^(y|yes|true)$/i.test(raw), n = /^(n|no|false)$/i.test(raw);
      if (!y && !n) return { ok: false, kind: "unread", msg: "Answer yes or no." };
      return y === !!step.ans ? { ok: true } : { ok: false, kind: "wrong", msg: "Not quite. Look at the question again." };
    }
    if (type === "choice") {
      const want = String(step.ans).toLowerCase();
      const opts = (step.options || []).map((o) => o.toLowerCase());
      const got = raw.toLowerCase().replace(/[().]/g, "").trim();
      const idx = opts.indexOf(got);
      const asLetter = idx >= 0 ? String.fromCharCode(97 + idx) : got;
      return asLetter === want || got === want ? { ok: true } : { ok: false, kind: "wrong", msg: "Not that one." };
    }
    if (type === "text") {
      const need = step.ans.map((w) => w.toLowerCase());
      const ok = need.every((w) => raw.toLowerCase().includes(w));
      return ok ? { ok: true } : { ok: false, kind: "wrong", msg: "Something important is missing." };
    }
    if (type === "nums") {
      const parts = splitList(raw), vals = [];
      for (const pt of parts) { const e = tryEval(pt); if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that list. Separate the numbers with commas or “and”." }; vals.push(e.v); }
      const want = step.ans.map(big);
      const nkey = vals.map(show).join(",");
      if (step.named && step.named[nkey]) return { ok: false, kind: "named", msg: step.named[nkey] };
      if (vals.length !== want.length) return { ok: false, kind: "count", msg: "That isn't the full list of values yet, or it has an extra one." };
      const eqv = (a, b) => a.n === b.n && a.d === b.d;
      if (step.order) {
        if (vals.every((v, i) => eqv(v, want[i]))) return { ok: true };
        const sortedSame = [...vals].map(show).sort().join() === [...want].map(show).sort().join();
        if (sortedSame) return { ok: false, kind: "order", msg: "Right numbers, wrong order." };
      } else {
        const a = vals.map(show).sort().join(), b = want.map(show).sort().join();
        if (a === b) return { ok: true };
      }
      const hits = vals.filter((v) => want.some((w) => eqv(v, w))).length;
      if (hits === want.length - 1) return { ok: false, kind: "oneoff", msg: "Right number of values, but one is off." };
      return { ok: false, kind: "wrong", msg: "Those aren't the values." };
    }
    // num / expr
    const e = tryEval(raw);
    if (!e) return { ok: false, kind: "unread", msg: "I couldn't read that. Try a number like 37.5, −9 or 7/2, or an expression like 96 − 53 − 19." };
    const v = e.v, want = big(step.ans);
    if (type === "expr" && e.ops === 0) return { ok: false, kind: "form", msg: "This step wants an expression (with ×, ÷, ! or a power), not just the number." };
    if (v.n === want.n && v.d === want.d) return { ok: true, value: v };
    if (step.special === "ps17" && isInt(v) && v.n >= 6n && v.n <= 400n) {
      const n = v, s6 = choose(n, R(6n)), s3 = choose(n, R(3n)), six = mul(R(6n), s3);
      const cmp = s6.n < six.n ? "too few sets of 6 — try a bigger n" : "too many sets of 6 — try a smaller n";
      return { ok: false, kind: "named", value: v, msg: `For n = ${show(n)}: sets of 6 = ${show(s6)}, and 6 × sets of 3 = ${show(six)}. That's ${cmp}.` };
    }
    const key = show(v).replace(/,/g, "");
    if (step.named && step.named[key]) return { ok: false, kind: "named", value: v, msg: step.named[key] };
    for (let i = 0; i < others.length; i++) {
      if (others[i] === null || others[i] === undefined || Array.isArray(others[i]) || typeof others[i] === "boolean") continue;
      let o; try { o = big(others[i]); } catch (e) { continue; }
      if (o.n === v.n && o.d === v.d) return { ok: false, kind: "otherstep", value: v, msg: `That's step ${i + 1}'s answer.` };
    }
    if (!isInt(v) && isInt(want)) return { ok: false, kind: "frac", value: v, msg: "This step's answer is a whole number. Is a division off?" };
    const d = sub(v, want), ad = d.n < 0n ? R(-d.n, d.d) : d, aw = want.n < 0n ? R(-want.n, want.d) : want;
    const le = (a, b) => a.n * b.d <= b.n * a.d;
    const small10 = le(aw, R(10n));
    const close = small10 ? le(ad, R(1n, 2n)) : (le(mul(ad, R(50n)), aw) || le(ad, R(1n)));
    if (close) return { ok: false, kind: "close", value: v, msg: "Very close. Recheck the arithmetic." };
    if (d.n > 0n) return { ok: false, kind: "big", value: v, msg: "Too big." };
    return { ok: false, kind: "small", value: v, msg: "Too small." };
  }
  return { grade, evaluate: (s) => { const e = tryEval(s); return e ? show(e.v) : null; }, normalize };
})();

</script>
<script>
/* Step-through story: one picture per frame, Back/Next, progress dots, Show all, ←/→ when focused. */
window.STORY = (function () {
  "use strict";
  function setup(st) {
    if (st.dataset.ready) return;
    st.dataset.ready = "1";
    const frames = Array.from(st.querySelectorAll(":scope .frame"));
    const dots = st.querySelector(".dots"), back = st.querySelector("[data-act=back]"), next = st.querySelector("[data-act=next]");
    const all = st.querySelector("input.showall"), name = st.querySelector(".stepname");
    const marks = Array.from(st.querySelectorAll(".plan-side li[data-s], .plan-strip span[data-s]"));
    const skipped = new Set(frames.filter((f) => f.classList.contains("skip")).map((f) => f.dataset.step));
    marks.forEach((m) => m.classList.toggle("skipd", skipped.has(m.dataset.s)));
    let i = 0;
    const seen = new Set([0]);
    frames.forEach((f, k) => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("aria-label", "Picture " + (k + 1) + " of " + frames.length);
      b.addEventListener("click", () => go(k));
      dots.appendChild(b);
    });
    function go(k) { i = Math.max(0, Math.min(frames.length - 1, k)); seen.add(i); render(); }
    function render() {
      frames.forEach((f, k) => f.classList.toggle("on", k === i));
      Array.from(dots.children).forEach((b, k) => { b.classList.toggle("on", k === i); b.classList.toggle("seen", seen.has(k) && k !== i); });
      back.disabled = i === 0;
      next.disabled = i === frames.length - 1;
      const s = frames[i] && frames[i].dataset.step;
      marks.forEach((m) => m.classList.toggle("on", s && m.dataset.s === s));
      if (name) name.textContent = s && st.dataset.plan ? JSON.parse(st.dataset.plan)[+s - 1] : "";
    }
    back.addEventListener("click", () => go(i - 1));
    next.addEventListener("click", () => go(i + 1));
    st.addEventListener("keydown", (e) => {
      if (e.target.closest("input,textarea,select")) return;
      if (e.key === "ArrowRight") { go(i + 1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(i - 1); e.preventDefault(); }
    });
    all.addEventListener("change", () => st.classList.toggle("all", all.checked));
    st._go = go;
    render();
  }
  function init(root) { (root || document).querySelectorAll(".story").forEach(setup); }
  document.addEventListener("DOMContentLoaded", () => init());
  return { init };
})();

</script>
<script>
/* Pick grid: pointing at (or focusing) a box lights its twin, unless the grid is plain (no twins). */
(function () {
  "use strict";
  function twin(cell) {
    const svg = cell.closest("svg");
    if (!svg || svg.classList.contains("plain")) return null;
    const r = cell.getAttribute("data-r"), c = cell.getAttribute("data-c");
    if (r === c) return null;
    return svg.querySelector('.pg-cell[data-r="' + c + '"][data-c="' + r + '"]');
  }
  function on(e) { const c = e.target.closest && e.target.closest(".pg-cell"); if (!c) return; const t = twin(c); if (t) { t.classList.add("twin-lit"); c.classList.add("twin-lit"); } }
  function off(e) { const c = e.target.closest && e.target.closest(".pg-cell"); if (!c) return; const t = twin(c); if (t) { t.classList.remove("twin-lit"); c.classList.remove("twin-lit"); } }
  document.addEventListener("pointerover", on);
  document.addEventListener("pointerout", off);
  document.addEventListener("focusin", on);
  document.addEventListener("focusout", off);
})();

<script>
/* Workbench: problem rail, tabs, per-step grading loop, hint dialog, submit/reveal, timer, deep links.
   Nothing is stored between visits (no browser storage is used); ink is kept per problem in window.INK. */
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("bench-data").textContent);
  const P = DATA.problems, byId = {};
  P.forEach((p) => (byId[p.id] = p));
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---- ink per problem ---- */
  const inkStore = {};
  window.INK = { get: (id) => inkStore[id] || [], set: (id, strokes) => { inkStore[id] = strokes; } };

  /* ---- state ---- */
  const S = {};
  P.forEach((p) => {
    S[p.id] = { time: 0, cur: 0, revealed: false, submitted: false, confirmArmed: 0,
      steps: p.steps.map(() => ({ tries: 0, misses: 0, state: "open", work: "", hints: 0, answers: [] })) };
  });
  let cur = null, tab = DATA.page === "lesson" ? "concept" : "problem", lastTick = Date.now();

  function status(id) {
    const s = S[id];
    if (s.revealed || s.steps.every((x) => x.state !== "open")) return "closed";
    if (s.steps.some((x) => x.tries || x.work.trim() || x.hints)) return "prog";
    return "untouched";
  }
  function finished() { return P.filter((p) => status(p.id) === "closed").length; }

  /* ---- console ---- */
  function log(msg, cls) {
    const c = $("console");
    const d = el("div", cls || "");
    const t = new Date();
    d.innerHTML = '<span class="ts">' + String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0") + "</span>" + msg;
    c.appendChild(d);
    c.scrollTop = c.scrollHeight;
    if (cur) (S[cur].log = S[cur].log || []).push(d.outerHTML);
  }

  /* ---- top bar and rail ---- */
  function buildNav() {
    const sel = $("psel"), rail = $("rail");
    let lastSec = null, og = null;
    P.forEach((p) => {
      if (p.section !== lastSec) {
        og = el("optgroup"); og.label = p.section; sel.appendChild(og);
        rail.appendChild(el("h4", "", esc(p.section)));
        lastSec = p.section;
      }
      const o = el("option"); o.value = p.id; o.textContent = p.label; og.appendChild(o);
      const b = el("button", "", '<span class="sdot" aria-hidden="true"></span><span></span>');
      b.type = "button"; b.dataset.id = p.id; b.lastChild.textContent = p.label;
      b.setAttribute("aria-label", p.label);
      b.addEventListener("click", () => { select(p.id); rail.classList.remove("open"); });
      rail.appendChild(b);
    });
    sel.addEventListener("change", () => select(sel.value));
    $("prev").addEventListener("click", () => step(-1));
    $("next").addEventListener("click", () => step(1));
    $("railToggle").addEventListener("click", () => $("rail").classList.toggle("open"));
  }
  function step(d) { const i = P.findIndex((p) => p.id === cur); select(P[(i + d + P.length) % P.length].id); }
  function refreshNav() {
    $("psel").value = cur;
    document.querySelectorAll("#rail button[data-id]").forEach((b) => {
      b.classList.toggle("cur", b.dataset.id === cur);
      const st = status(b.dataset.id);
      b.firstChild.className = "sdot" + (st === "prog" ? " prog" : st === "closed" ? " closed" : "");
      b.setAttribute("aria-label", byId[b.dataset.id].label + " (" + (st === "untouched" ? "not started" : st === "prog" ? "in progress" : "finished") + ")");
    });
    $("finished").textContent = finished() + " / " + P.length + " finished";
  }

  /* ---- timer ---- */
  function tick() {
    const now = Date.now();
    if (cur && !document.hidden) S[cur].time += now - lastTick;
    lastTick = now;
    if (cur) { const s = Math.floor(S[cur].time / 1000); $("timer").textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  }
  setInterval(tick, 1000);

  /* ---- tabs ---- */
  function setTab(t) {
    tab = t;
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    document.querySelectorAll(".tabpanel").forEach((pn) => (pn.hidden = pn.id !== "tab-" + t));
    if (t === "steps") renderMySteps();
  }

  /* ---- middle pane ---- */
  function renderProblem() {
    const p = byId[cur], s = S[cur], box = $("tab-problem");
    let h = '<h2>' + esc(p.label) + "</h2>";
    h += '<div class="ptext">' + esc(p.text) + (p.figure ? '<div class="pfig">' + p.figure + "</div>" : "") + "</div>";
    let meta = "";
    if (p.inclass) meta += '<span class="inclass" title="time in your class video">In class ' + esc(p.inclass) + "</span>";
    if (p.above) meta += '<span class="above">Above grade: split into steps</span>';
    if (meta) h += '<p class="pnote">' + meta + "</p>";
    if (p.note) h += '<p class="pnote">' + esc(p.note) + "</p>";
    const open = s.revealed || s.submitted;
    if (open) {
      h += '<div class="verified" id="verified"><h3>Verified answer: ' + esc(p.answer) + "</h3><p>" + esc(p.check) + "</p>" +
        "<h3>Worked answer</h3>" + p.story + "</div>";
    } else {
      h += '<p class="pnote">The worked answer appears here after you close every step and press <b>Submit question</b>.</p>';
    }
    box.innerHTML = h;
    if (open) window.STORY.init(box);
    if (DATA.page === "lesson") {
      $("tab-concept").innerHTML = DATA.concepts[p.concept];
      window.STORY.init($("tab-concept"));
    }
  }
  function renderMySteps() {
    const p = byId[cur], s = S[cur];
    let h = '<div class="mysteps">';
    p.steps.forEach((st, i) => {
      const x = s.steps[i];
      const res = x.state === "ok" ? "✓ closed" : x.state === "handed" ? "answer handed over" : x.tries ? "open (" + x.tries + " tries)" : "not tried";
      h += '<div class="ms"><b>Step ' + (i + 1) + ":</b> " + esc(st.q) + '<br><span class="pnote">' + res + (x.hints ? ", hint opened" : "") +
        "</span>" + (x.work.trim() ? "<pre>" + esc(x.work) + "</pre>" : "") +
        (x.answers.length ? '<span class="pnote">Answers tried: ' + x.answers.map(esc).join(" · ") + "</span>" : "") + "</div>";
    });
    $("tab-steps").innerHTML = h + "</div>";
  }

  /* ---- right pane ---- */
  function renderRight() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur], x = s.steps[s.cur];
    const pills = $("pills");
    pills.innerHTML = "";
    p.steps.forEach((_, i) => {
      const b = el("button");
      b.type = "button";
      b.textContent = "Step " + (i + 1);
      const xi = s.steps[i];
      b.className = (i === s.cur ? "cur " : "") + (xi.state === "ok" ? "ok" : xi.state === "handed" ? "handed" : xi.tries ? "tried" : "");
      b.setAttribute("aria-label", "Step " + (i + 1) + (xi.state === "ok" ? ", closed" : xi.state === "handed" ? ", handed over" : ", open"));
      b.addEventListener("click", () => { saveWork(); s.cur = i; renderRight(); });
      pills.appendChild(b);
    });
    $("stepq").textContent = st.q;
    $("work").value = x.work;
    syncGutter();
    $("answer").value = "";
    $("answer").placeholder = st.ph;
    const closed = x.state !== "open";
    $("answer").disabled = closed;
    $("check").disabled = closed;
    $("hint").disabled = closed;
    $("stepstate").textContent = x.state === "ok" ? "Step closed. " + st.ok : x.state === "handed" ? "Answer handed over: " + st.reveal : (x.misses === 3 ? "One final attempt on this step." : "");
    $("reveal").textContent = "Show worked answer";
    $("confirmNote").textContent = "";
    s.confirmArmed = 0;
  }
  function saveWork() { if (cur) S[cur].steps[S[cur].cur].work = $("work").value; }
  function syncGutter() {
    const n = Math.max(6, $("work").value.split("\n").length);
    $("gutter").innerHTML = Array.from({ length: n }, (_, i) => i + 1).join("<br>");
    $("gutter").scrollTop = $("work").scrollTop;
  }

  /* ---- grading loop ---- */
  function nextOpen(s) {
    const n = s.steps.length;
    for (let k = 1; k <= n; k++) { const j = (s.cur + k) % n; if (s.steps[j].state === "open") return j; }
    return s.cur;
  }
  function checkStep() {
    const p = byId[cur], s = S[cur], i = s.cur, st = p.steps[i], x = s.steps[i];
    if (x.state !== "open") return;
    saveWork();
    const val = $("answer").value;
    const others = p.steps.map((o, k) => (k === i ? null : o.ans));
    const r = window.CHECK.grade(st, val, others);
    if (r.kind === "empty" || r.kind === "unread" || r.kind === "count" || r.kind === "form") { log("Step " + (i + 1) + ": " + esc(r.msg), "info"); return; }
    x.tries++;
    x.answers.push(val.trim());
    if (r.ok) {
      x.state = "ok";
      log("✓ Step " + (i + 1) + " closed (“" + esc(val.trim()) + "”). " + esc(st.ok), "ok");
      s.cur = nextOpen(s);
    } else {
      x.misses++;
      const nudge = st.nudges[Math.min(x.misses - 1, 2)];
      if (x.misses <= 3) {
        log("✗ Step " + (i + 1) + ", try " + x.misses + ": “" + esc(val.trim()) + "”. " + esc(r.msg) + " " + esc(nudge), "bad");
        if (x.misses === 3) log("One final attempt on step " + (i + 1) + ".", "hand");
      } else {
        x.state = "handed";
        log("✗ Step " + (i + 1) + ", final attempt: “" + esc(val.trim()) + "”. " + esc(r.msg), "bad");
        log("Handing over step " + (i + 1) + ": " + esc(st.reveal) + " Check: " + esc(st.check) + " Keep going with the next step yourself.", "hand");
        s.cur = nextOpen(s);
      }
    }
    renderRight();
    refreshNav();
    if (tab === "steps") renderMySteps();
  }
  function openHint() {
    const p = byId[cur], s = S[cur], st = p.steps[s.cur];
    s.steps[s.cur].hints++;
    $("hintTitle").textContent = "Hint for step " + (s.cur + 1);
    $("hintBody").textContent = st.hint;
    $("hintDialog").classList.add("open");
    $("hintClose").focus();
    log("Hint opened for step " + (s.cur + 1) + " (doesn't use a try).", "info");
    refreshNav();
  }
  function closeHint() { $("hintDialog").classList.remove("open"); $("answer").focus(); }
  function submit() {
    const p = byId[cur], s = S[cur];
    saveWork();
    const open = s.steps.map((x, i) => (x.state === "open" ? i + 1 : null)).filter(Boolean);
    if (open.length) { log("Not yet: step" + (open.length > 1 ? "s " : " ") + open.join(", ") + " still open.", "info"); return; }
    const lines = s.steps.map((x, i) => "Step " + (i + 1) + ": " + (x.state === "handed" ? "handed over after 4 misses" : x.tries === 1 ? "first try" : "closed on try " + x.tries) + (x.hints ? ", hint used" : ""));
    log("Submitted. " + lines.join("; ") + ". Verified answer and worked story are open in the Problem tab.", "ok");
    s.submitted = true;
    setTab("problem");
    renderProblem();
    refreshNav();
  }
  function reveal() {
    const s = S[cur];
    const untried = s.steps.some((x) => x.state === "open" && x.tries === 0);
    if (untried && !(s.confirmArmed && Date.now() - s.confirmArmed < 8000)) {
      s.confirmArmed = Date.now();
      $("confirmNote").textContent = "Some steps haven't been tried yet. Press again to show the worked answer anyway.";
      $("reveal").textContent = "Yes, show it";
      return;
    }
    s.revealed = true;
    s.confirmArmed = 0;
    $("confirmNote").textContent = "";
    $("reveal").textContent = "Show worked answer";
    log("Worked answer shown.", "info");
    setTab("problem");
    renderProblem();
    refreshNav();
  }

  /* ---- selection ---- */
  function select(id) {
    if (!byId[id]) return;
    tick();
    saveWork();
    const from = cur;
    cur = id;
    document.dispatchEvent(new CustomEvent("bench:problem", { detail: { from, to: id } }));
    $("console").innerHTML = (S[id].log || []).join("");
    renderProblem();
    renderRight();
    setTab(DATA.page === "lesson" ? "concept" : "problem");
    refreshNav();
    window.SAFE.setHash(id);
    tick();
  }

  /* ---- wiring ---- */
  document.addEventListener("DOMContentLoaded", () => {
    buildNav();
    document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
    $("check").addEventListener("click", checkStep);
    $("hint").addEventListener("click", openHint);
    $("hintClose").addEventListener("click", closeHint);
    $("submit").addEventListener("click", submit);
    $("reveal").addEventListener("click", reveal);
    $("answer").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); checkStep(); } });
    $("work").addEventListener("input", () => { syncGutter(); saveWork(); refreshNav(); });
    $("work").addEventListener("scroll", syncGutter);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("hintDialog").classList.contains("open")) closeHint(); });
    $("hintDialog").addEventListener("click", (e) => { if (e.target === $("hintDialog")) closeHint(); });
    const h = window.SAFE.getHash();
    select(byId[h] ? h : P[0].id);
  });
  window.BENCH = { select, state: S, status, grade: () => checkStep(), current: () => cur };
})();

</script>
<script>
/* Teaching pen.
   Two viewport-sized canvases: `base` holds committed strokes, `live` holds only the stroke being drawn.
   While drawing, only the newest segments are painted; old strokes are never redrawn.
   Reading pages (data-penmode="page"): strokes are stored in page coordinates and stay on the content; a finger scrolls.
   Workbench pages (data-penmode="viewport"): strokes are viewport-anchored, the pen layer swallows scrolling,
   and ink is kept per problem through window.INK.get/set. */
(function () {
  "use strict";
  const MODE = document.body.dataset.penmode === "viewport" ? "viewport" : "page";
  const DPR = Math.min(2, window.devicePixelRatio || 1);
  const COLORS = [["ink", "#1C2A4A"], ["red", "#C23A2E"], ["blue", "#2D6BD0"], ["green", "#1E7A50"]];
  const WIDTHS = [2, 3.5, 6];
  const stats = { framesDrawing: 0, oldRedrawsWhileDrawing: 0, baseRedraws: 0, segmentsPainted: 0 };
  window.__PEN = { stats, mode: MODE, megapixels: () => 2 * (base.width * base.height) / 1e6, strokes: () => strokes };

  const base = document.createElement("canvas"), live = document.createElement("canvas");
  base.className = "pen-canvas base"; live.className = "pen-canvas live";
  base.setAttribute("aria-hidden", "true"); live.setAttribute("aria-hidden", "true");
  const bctx = base.getContext("2d"), lctx = live.getContext("2d");
  let strokes = [], undoStack = [], redoStack = [];
  let on = false, tool = "pen", color = COLORS[0][1], widthIdx = 1, stylusOnly = false;
  let drawing = null, raf = 0, scrollRaf = 0;

  function off() { return MODE === "page" ? [window.scrollX, window.scrollY] : [0, 0]; }
  function size() {
    for (const c of [base, live]) {
      c.width = Math.round(window.innerWidth * DPR);
      c.height = Math.round(window.innerHeight * DPR);
      c.style.width = window.innerWidth + "px";
      c.style.height = window.innerHeight + "px";
      c.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    redrawBase();
  }

  /* ---- drawing primitives ---- */
  function style(ctx, s) {
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = s.color;
    ctx.globalAlpha = s.tool === "marker" ? 0.32 : 1;
  }
  function seg(ctx, s, k, ox, oy) {
    // smoothed segment k: from mid(k-2,k-1) to mid(k-1,k) with control point k-1
    const p = s.pts;
    const a = p[k - 2] || p[k - 1], b = p[k - 1], c = p[k];
    const m1x = (a[0] + b[0]) / 2 - ox, m1y = (a[1] + b[1]) / 2 - oy, m2x = (b[0] + c[0]) / 2 - ox, m2y = (b[1] + c[1]) / 2 - oy;
    ctx.lineWidth = b[2];
    ctx.beginPath(); ctx.moveTo(m1x, m1y); ctx.quadraticCurveTo(b[0] - ox, b[1] - oy, m2x, m2y); ctx.stroke();
    stats.segmentsPainted++;
  }
  function drawShape(ctx, s, ox, oy) {

  function accept(e) {

    undoStack.push({ type: "add", stroke: s }); redoStack = [];

  function schedule() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame() {

  }
  function nearShape(s, x, y) {
    const a = s.pts[0], b = s.pts[s.pts.length - 1];
    const segs = s.tool === "box" ? [[a[0], a[1], b[0], a[1]], [b[0], a[1], b[0], b[1]], [b[0], b[1], a[0], b[1]], [a[0], b[1], a[0], a[1]]] : [[a[0], a[1], b[0], b[1]]];

      const L = Math.hypot(x2 - x1, y2 - y1) || 1, t = Math.max(0, Math.min(1, ((x - x1) * (x2 - x1) + (y - y1) * (y2 - y1)) / (L * L)));
      return Math.hypot(x - (x1 + t * (x2 - x1)), y - (y1 + t * (y2 - y1))) < 10;
    });
  }

  /* ---- history ---- */
  function undo() {
    const a = undoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.splice(strokes.lastIndexOf(a.stroke), 1);
    else if (a.type === "erase") a.items.slice().reverse().forEach((it) => strokes.splice(it.index, 0, it.stroke));
    else if (a.type === "clear") strokes = a.items.slice();
    redoStack.push(a); redrawBase(); persist();
  }
  function redo() {
    const a = redoStack.pop(); if (!a) return;
    if (a.type === "add") strokes.push(a.stroke);
    else if (a.type === "erase") a.items.forEach((it) => { const i = strokes.indexOf(it.stroke); if (i >= 0) strokes.splice(i, 1); });

  function clearAll() {

    strokes = []; redrawBase(); persist();
  }
  function exportPng() {
    try {
      const a = document.createElement("a");
      a.href = base.toDataURL("image/png");
      a.download = "ink.png";
      document.body.appendChild(a); a.click(); a.remove();
      note("Saved the ink only (not the page underneath).");
    } catch (err) { note("Export isn't allowed here."); }
  }

  /* ---- per-problem ink (workbench) ---- */
  let problemId = null;
  function persist() { if (MODE === "viewport" && problemId && window.INK) window.INK.set(problemId, strokes.slice()); }
  document.addEventListener("bench:problem", (e) => {
    if (MODE !== "viewport") return;
    if (e.detail.from && window.INK) window.INK.set(e.detail.from, strokes.slice());
    problemId = e.detail.to;
    strokes = window.INK ? window.INK.get(problemId).slice() : [];
    undoStack = []; redoStack = [];
    redrawBase();
  });

  /* ---- toolbar ---- */
  const bar = document.createElement("div");
  bar.className = "pen-bar"; bar.setAttribute("role", "toolbar"); bar.setAttribute("aria-label", "Teaching pen");
  const btn = (label, title, fn, pressed) => {
    const b = document.createElement("button"); b.type = "button"; b.innerHTML = label; b.title = title; b.setAttribute("aria-label", title);
    if (pressed !== undefined) b.setAttribute("aria-pressed", String(pressed));
    b.addEventListener("click", fn); return b;
  };
  const toggle = btn("✎ Pen", "Pen on/off (P)", () => setOn(!on), false);
  const tools = document.createElement("div"); tools.className = "tools";
  const toolBtns = {};
  [["pen", "✎", "Pen"], ["marker", "▬", "Marker"], ["line", "╱", "Straight line"], ["box", "▭", "Box"], ["eraser", "⌫", "Eraser"]].forEach(([k, g, t]) => {
    toolBtns[k] = btn(g, t, () => setTool(k), k === tool); tools.appendChild(toolBtns[k]);
  });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const colBtns = COLORS.map(([n, c], i) => { const b = btn('<span class="sw" style="background:' + c + '"></span>', n + " ink", () => setColor(i), i === 0); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  const wBtns = WIDTHS.map((w, i) => { const b = btn(["thin", "medium", "thick"][i][0].toUpperCase(), ["Thin", "Medium", "Thick"][i] + " nib", () => setWidth(i), i === widthIdx); tools.appendChild(b); return b; });
  tools.appendChild(Object.assign(document.createElement("span"), { className: "sep" }));
  tools.appendChild(btn("↶", "Undo", undo)); tools.appendChild(btn("↷", "Redo", redo)); tools.appendChild(btn("Clear", "Clear all ink (undoable)", clearAll));
  tools.appendChild(btn("PNG", "Export the ink only as a PNG image (not the page)", exportPng));
  const stylusBtn = btn("Stylus only", "Ignore finger touches (palm rejection)", () => { stylusOnly = !stylusOnly; stylusBtn.setAttribute("aria-pressed", String(stylusOnly)); }, false);
  tools.appendChild(stylusBtn);

  tools.appendChild(noteEl);

  function note(t) { noteEl.textContent = t; }
  function setOn(v) {
    on = v;
    toggle.setAttribute("aria-pressed", String(on));
    bar.classList.toggle("open", on);
    live.classList.toggle("active", on);
    live.classList.toggle(MODE === "page" ? "touchpass" : "swallow", on);

  function setTool(k) { tool = k; Object.entries(toolBtns).forEach(([n, b]) => b.setAttribute("aria-pressed", String(n === k))); }
  function setColor(i) { color = COLORS[i][1]; colBtns.forEach((b, j) => b.setAttribute("aria-pressed", String(i === j))); }

  live.addEventListener("pointermove", move);
  live.addEventListener("pointerup", up);
  live.addEventListener("pointercancel", up);

    window.addEventListener("scroll", () => { if (!scrollRaf) scrollRaf = requestAnimationFrame(() => { scrollRaf = 0; redrawBase(); }); }, { passive: true });

    live.addEventListener("wheel", (e) => { if (on) e.preventDefault(); }, { passive: false });
  }

    size();

})();
