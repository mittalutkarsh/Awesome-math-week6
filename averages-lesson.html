<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson: guided problems · Mean, median and mode</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet"><style>
/* Math notebook: graph-paper ground, navy fountain-pen ink, a yellow highlighter, a red correction pen.
   Two typefaces: Atkinson Hyperlegible (text, built for young readers) and Kalam (the handwritten voice). */
:root{
  --paper:#FBFCFE; --sheet:#FFFFFF; --rule:#DCE5F2; --rule2:#C9D6EA;
  --ink:#1C2A4A; --pencil:#5E6A82; --faint:#8E99AE;
  --hl:#FFE45E; --hl-soft:#FFF4B8; --red:#C23A2E; --green:#1E7A50; --blue:#2D6BD0;
  --p1:#2D6BD0; --p2:#D98A00; --p3:#7B4CC0; --p4:#1E7A50; --p5:#138A8A; --p6:#C2407A;
  --console:#14223F; --console-ink:#DDE6F6;
  --hand:"Kalam","Comic Neue","Segoe Print",cursive;
  --text:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:5px; --r-md:9px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.55}
body.reading{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:26px 26px;background-attachment:local}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:3px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1.15;color:var(--ink);margin:0 0 .4em}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.4rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%)}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:var(--r-sm);padding:.35em .8em;font-size:.95rem}
.btn:hover{background:var(--hl-soft)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#2B3E68}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
kbd{font-family:var(--text);border:1px solid var(--rule2);border-bottom-width:2px;border-radius:4px;padding:0 .3em;font-size:.85em}

/* ---------- equations ---------- */
.eq{font-size:1.35rem;text-align:center;padding:.7em .6em;margin:.2em 0 1em;border-left:4px solid var(--ink);
  background:var(--sheet);display:flex;flex-wrap:wrap;gap:.35em;align-items:center;justify-content:center}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 .15em}
.frac>span:first-child{border-bottom:1.5px solid var(--ink);padding:0 .25em}
.frac>span:last-child{padding:0 .25em}
.binom{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;padding:0 .35em;position:relative;line-height:1.1}
.binom::before,.binom::after{content:"";position:absolute;top:0;bottom:0;width:.35em;border:1.5px solid var(--ink)}
.binom::before{left:0;border-right:none;border-radius:.6em 0 0 .6em}
.binom::after{right:0;border-left:none;border-radius:0 .6em .6em 0}
.eqnote{font-size:.85rem;color:var(--pencil)}

/* ---------- SVG pictures ---------- */
svg.pic{width:100%;height:auto;max-height:340px;display:block;margin:0 auto;font-family:var(--text);overflow:visible}
.pic .t,.pic .cap{fill:var(--pencil);font-size:12px}
.pic .vert{writing-mode:tb}
.pic .chip{fill:#fff;stroke:var(--ink);stroke-width:1.3}
.pic .chip.picked{fill:var(--hl);stroke:var(--ink)}
.pic .chip.used{fill:#EEF1F6;stroke:#B6BECC}
.pic .chip.banned{fill:#FBE9E7;stroke:var(--red)}
.pic .chiptxt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .chiptxt.used{fill:#9AA4B5}
.pic .strike{stroke-width:2;stroke-linecap:round}
.pic .strike.used{stroke:#9AA4B5}
.pic .strike.banned{stroke:var(--red)}
.pic .strike.big{stroke-width:3.5;opacity:.85}
.pic .sub{font-size:9px}
.pic .chip.p1,.pic .tile.p1{fill:#E1ECFC;stroke:var(--p1)}
.pic .chip.p2,.pic .tile.p2{fill:#FCEFD6;stroke:var(--p2)}
.pic .chip.p3,.pic .tile.p3{fill:#ECE3F8;stroke:var(--p3)}
.pic .chip.p4,.pic .tile.p4{fill:#DEF1E7;stroke:var(--p4)}
.pic .chip.p5,.pic .tile.p5{fill:#DAF0F0;stroke:var(--p5)}
.pic .chip.p6,.pic .tile.p6{fill:#F8E1EB;stroke:var(--p6)}
.pic .tile{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .tile.real{fill:var(--hl)}
.pic .tile.pl{fill:#F1F3F7;stroke:#9AA4B5}
.pic .tilet{fill:var(--ink);font-size:16px;font-weight:700}
.pic .tilet.sm{font-size:13px}
.pic .slot{fill:#fff;stroke:var(--ink);stroke-width:1.6}
.pic .result{fill:var(--hl);stroke:var(--ink);stroke-width:1.6}
.pic .fracline{stroke:var(--ink);stroke-width:1.6}
.pic .numbox{fill:#fff;stroke:var(--ink);stroke-width:1.2}
.pic .slotlab{fill:var(--pencil);font-size:12px}
.pic .slotn,.pic .calcn{fill:var(--ink);font-size:20px;font-weight:700}
.pic .op{fill:var(--ink);font-size:22px;font-weight:700}
.pic .op.big{font-size:30px}
.pic .card{fill:#fff;stroke:var(--rule2)}
.pic .arrow{stroke:var(--ink);stroke-width:2;fill:none}
.pic .ahead{fill:var(--ink)}
.pic .groupbox{fill:var(--hl-soft);stroke:var(--ink);stroke-width:1.6}
.pic .groupt{fill:var(--ink);font-size:17px;font-weight:700}
.pic .pg-cell{fill:#fff;stroke:var(--rule2);stroke-width:1}
.pic .pg-cell.diag{fill:#FBE9E7}
.pic .pg-cell.lower{fill:#EEF1F6}
.pic .pg-cell.hl,.pic .pg-cell.twin-lit{fill:var(--hl);stroke:var(--ink)}
.pic .pg-cell:hover{stroke:var(--ink);stroke-width:2}
.pic .pgt{fill:var(--ink);pointer-events:none}
.pic .pgt.dim{fill:#9AA4B5}
.pic .gridlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .edge{stroke:var(--pencil);stroke-width:1.3}
.pic .tnode{fill:#fff;stroke:var(--rule2)}
.pic .nodet{fill:var(--ink);font-size:12px;font-weight:700}
.pic .node.root{fill:var(--ink)}
.pic .rowhl{fill:var(--hl-soft)}
.pic .brace{fill:none;stroke:var(--ink);stroke-width:1.6}
.pic .seg{stroke:var(--faint);stroke-width:1.6}
.pic .seg.hl{stroke:var(--blue);stroke-width:4;stroke-linecap:round;opacity:.85}
.pic .seg.hl2{stroke:var(--p2);stroke-width:4;stroke-linecap:round;opacity:.8}
.pic .dot{fill:var(--ink)}
.pic .dotlab{fill:var(--ink);font-size:13px;font-weight:700}
.pic .gl{stroke:var(--rule2);stroke-width:1.3}
.pic .gl.hlv{stroke:var(--blue);stroke-width:3.5}
.pic .gl.hlh{stroke:var(--green);stroke-width:3.5}
.pic .numv{fill:var(--blue);font-weight:700}
.pic .numh{fill:var(--green);font-weight:700}
.pic .shade{fill:var(--hl);opacity:.6}
.pic .path{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.pic .path.leg1{stroke:var(--blue)}
.pic .path.leg2{stroke:var(--p2);stroke-dasharray:7 4}
.pic .bag{fill:#F4F7FC;stroke:var(--ink);stroke-width:1.5}
.pic .oval{fill:none;stroke:var(--hl);stroke-width:8;opacity:.9}
.pic .oval.diff{stroke:#F2C2BC}
.pic .lcell{fill:#fff;stroke:var(--rule2)}
.pic .lcell.hl{fill:var(--hl)}
.pic .lt{fill:var(--ink);font-size:13px;font-weight:700}
.pic .wcard{fill:#fff;stroke:var(--ink);stroke-width:1.4}
.pic .wcard.skip{fill:#F3F5F9;stroke:#B6BECC;stroke-dasharray:5 4}
.pic .cardt{fill:var(--ink);font-size:15px}
.pic .coin.gold{fill:#F7D774;stroke:#9A7400}
.pic .coin.silver{fill:#E3E7EE;stroke:#7D8696}
.pic .coint{fill:var(--ink);font-size:11px;font-weight:700}
.pic .badring{fill:none;stroke:var(--red);stroke-width:2.5}
.pic .state{fill:#fff;stroke:var(--rule2)}
.pic .state.picked{fill:var(--hl-soft);stroke:var(--ink)}
.pic .person{fill:var(--hl-soft);stroke:var(--ink)}
.pic .persont{fill:var(--ink);font-weight:700;font-size:13px}
.hstack{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.hstack>svg.pic{width:100%;flex:1 1 200px;min-width:0}
.vstack{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.vstack>svg.pic{width:100%}
.ptable{border-collapse:collapse;margin:0 auto;font-size:.92rem;background:#fff}
.ptable th,.ptable td{border:1px solid var(--rule2);padding:.25em .6em;text-align:center}
.ptable th{background:#EEF3FA;font-weight:700}
.ptable tr.hl td{background:var(--hl-soft);font-weight:700}

/* ---------- story component ---------- */
.story{container-type:inline-size;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem;margin:.6rem 0 1.2rem}
.story:focus-visible{outline:3px solid var(--blue)}
.story .frame{display:none;margin:0}
.story .frame.on{display:block}
.story.all .frame{display:block;border-bottom:1px dashed var(--rule2);padding-bottom:.8rem;margin-bottom:.8rem}
.frame .pic-wrap{min-height:80px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
.frame figcaption{margin-top:.5rem}
.frame figcaption p{margin:.2em 0}
.frame .ftitle{font-family:var(--hand);font-size:1.15rem;margin:0 0 .3rem}
.frame.skip .ftitle{text-decoration:line-through;color:var(--faint)}
.frame.skip figcaption p{color:var(--pencil)}
.ask{margin-top:.5rem;padding:.4rem .7rem;border-left:4px solid var(--hl);background:#FFFBE6;font-size:.95rem}
.ask b{font-family:var(--hand)}
.story-ctl{display:flex;align-items:center;gap:.6rem;margin-top:.6rem;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;padding:0}
.dots button.on{background:var(--ink)}
.dots button.seen{background:var(--rule2)}
.story-ctl label{font-size:.9rem;color:var(--pencil);margin-left:auto}
.story.all .story-ctl .nav{visibility:hidden}

/* plan-guided: flowchart beside picture on wide containers, step strip on narrow */
.wbody{display:block}
.plan-side{display:none}
.plan-strip{display:flex;gap:4px;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.plan-strip span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule2);display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:var(--pencil)}
.plan-strip span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-strip span.skipd{text-decoration:line-through}
.plan-strip .stepname{font-family:var(--hand);font-size:1.1rem;color:var(--ink);margin-left:.4rem;width:auto;height:auto;border:none;justify-content:flex-start}
@container (min-width:680px){
  .wbody{display:grid;grid-template-columns:215px 1fr;gap:1rem}
  .plan-side{display:block}
  .plan-strip{display:none}
}
.plan-side ol{list-style:none;margin:0;padding:0;counter-reset:pl}
.plan-side li{counter-increment:pl;padding:.35rem .5rem .35rem 2.1rem;position:relative;font-size:.9rem;color:var(--pencil);border-radius:6px;margin-bottom:3px}
.plan-side li::before{content:counter(pl);position:absolute;left:.4rem;top:.3rem;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem}
.plan-side li.on{background:var(--hl);color:var(--ink);font-weight:700}
.plan-side li.on::before{background:var(--ink);color:#fff;border-color:var(--ink)}
.plan-side li.skipd{text-decoration:line-through}
.plan-side li+li::after{content:"";position:absolute;left:1.05rem;top:-4px;height:5px;border-left:1.5px solid var(--rule2)}

/* ---------- reading pages ---------- */
.page{max-width:1180px;margin:0 auto;padding:1.4rem 1.2rem 4rem;display:grid;grid-template-columns:230px minmax(0,1fr);gap:2rem}
.toc{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;font-size:.92rem;background:var(--sheet);
  border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem}
.toc a{display:block;text-decoration:none;color:var(--ink);padding:.15rem .3rem;border-radius:4px}
.toc a:hover{background:var(--hl-soft)}
.toc .sub{padding-left:1rem;font-size:.86rem;color:var(--pencil)}
main.reading-main{min-width:0}
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:1.3rem 1.4rem;margin-bottom:1.6rem}
.sheet>p,.sheet li{max-width:72ch}
.idea{font-size:1.1rem;font-weight:700}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.chips a{border:1.5px solid var(--ink);border-radius:999px;padding:.1rem .7rem;text-decoration:none;color:var(--ink);font-size:.9rem;background:#fff}
.chips a:hover{background:var(--hl)}
.fromclass{border-left:4px solid var(--blue);background:#F1F6FE;padding:.6rem .8rem;margin:.8rem 0;font-size:.95rem}
.fromclass b{font-family:var(--hand)}
.traps{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;padding:0;list-style:none}
.traps li{background:#fff;border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.7rem .9rem;max-width:none}
.traps .wrong{color:var(--red);font-weight:700;text-decoration:line-through;text-decoration-thickness:2px}
.cheat{width:100%;border-collapse:collapse}
.cheat td,.cheat th{border:1px solid var(--rule2);padding:.4rem .6rem;vertical-align:top;text-align:left}
.cheat th{background:#EEF3FA}
dl.gloss dt{font-weight:700;margin-top:.6rem}
dl.gloss dd{margin:0 0 0 1rem;max-width:70ch}
.site-head{display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;padding:1rem 1.2rem 0;max-width:1180px;margin:0 auto}
.site-head nav a{margin-right:1rem}
.lede{font-size:1.15rem;max-width:62ch}

/* ---------- workbench ---------- */
body.bench{height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-bottom:1.5px solid var(--ink);background:var(--sheet);flex-wrap:wrap}
.topbar .brand{font-family:var(--hand);font-weight:700;font-size:1.25rem;margin-right:.4rem}
.topbar select{font:inherit;font-size:.92rem;padding:.25rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);max-width:280px}
.topbar .meta{font-size:.9rem;color:var(--pencil);display:flex;gap:1rem;align-items:center}
.topbar .links{margin-left:auto;display:flex;gap:.8rem;font-size:.92rem}
.benchgrid{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr) minmax(360px,430px)}
.rail{border-right:1.5px solid var(--ink);overflow:auto;padding:.5rem;background:var(--paper)}
.rail h4{font-family:var(--hand);font-size:1.05rem;margin:.6rem 0 .2rem}
.rail button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;border:none;background:none;padding:.25rem .4rem;border-radius:5px;font-size:.92rem;color:var(--ink)}
.rail button:hover{background:var(--hl-soft)}
.rail button.cur{background:var(--hl);font-weight:700}
.sdot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--pencil);flex:none}
.sdot.prog{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sdot.closed{background:var(--green);border-color:var(--green)}
.middle{overflow:auto;padding:0 1rem 1rem;background:var(--paper)}
.tabs{display:flex;gap:.2rem;position:sticky;top:0;background:var(--paper);padding-top:.5rem;z-index:2;border-bottom:1.5px solid var(--ink)}
.tabs button{border:1.5px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;background:#EEF3FA;padding:.3rem .9rem;margin-bottom:-1.5px;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--sheet);font-weight:700}
.tabpanel{padding-top:.8rem}
.ptext{font-size:1.08rem;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.pfig{max-width:380px;margin:.8rem auto 0}
.pfig svg.pic{max-height:300px}
.pfig .pic .gl{stroke:var(--ink);stroke-width:1.2}
.pnote{font-size:.9rem;color:var(--pencil);margin:.5rem 0}
.inclass{display:inline-block;font-size:.85rem;border:1px solid var(--blue);color:var(--blue);border-radius:999px;padding:0 .6rem;margin-right:.4rem}
.above{display:inline-block;font-size:.85rem;border:1px solid var(--p3);color:var(--p3);border-radius:999px;padding:0 .6rem}
.verified{margin-top:1rem;border:2px solid var(--green);border-radius:var(--r-md);background:#F2FAF5;padding:.8rem 1rem}
.verified h3{color:var(--green)}
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0;background:var(--sheet)}
.rscroll{overflow:auto;padding:.7rem .8rem;flex:1;min-height:0}
.pills{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.5rem}
.pills button{border:1.5px solid var(--ink);border-radius:999px;background:#fff;padding:.05rem .65rem;font-size:.88rem}
.pills button.cur{outline:3px solid var(--hl);outline-offset:1px;font-weight:700}
.pills button.ok{background:#DDF1E5;border-color:var(--green)}
.pills button.handed{background:#FBE9E7;border-color:var(--red)}
.pills button.tried{background:#EEF3FA}
.stepq{font-weight:700;margin:.2rem 0 .5rem}
.editor{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);height:140px;background:#fff;
  background-image:linear-gradient(transparent 23px,var(--rule) 23px);background-size:100% 24px;background-position:0 6px}
.gutter{width:2.2rem;text-align:right;padding:6px .35rem 0 0;color:var(--faint);font-size:.85rem;line-height:24px;overflow:hidden;border-right:1px solid var(--rule2);user-select:none}
.editor textarea{flex:1;border:none;resize:none;padding:6px .5rem 0;font:inherit;font-size:.95rem;line-height:24px;background:transparent;color:var(--ink);font-family:var(--hand)}
.editor textarea:focus{outline:none}
.editor:focus-within{outline:3px solid var(--blue);outline-offset:1px}
.ansrow{display:flex;gap:.4rem;margin:.6rem 0}
.ansrow input{flex:1;font:inherit;padding:.35rem .5rem;border:1.5px solid var(--ink);border-radius:var(--r-sm);min-width:0}
.btnrow{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.console{background:var(--console);color:var(--console-ink);font-size:.86rem;padding:.6rem .7rem;height:170px;overflow:auto;border-top:1.5px solid var(--ink);flex:none}
.console div{margin-bottom:.3rem;line-height:1.4}
.console .ok{color:#8BE0AC}
.console .bad{color:#FFB3A8}
.console .info{color:#A9C3F0}
.console .hand{color:#FFE45E}
.console .ts{color:#6F84AD;margin-right:.4rem}
.dialog-back{position:fixed;inset:0;background:rgba(28,42,74,.35);display:none;align-items:center;justify-content:center;z-index:50}
.dialog-back.open{display:flex}
.dialog{background:var(--sheet);border:2px solid var(--ink);border-radius:var(--r-md);max-width:460px;padding:1rem 1.2rem;margin:1rem}
.dialog h3{margin-top:0}
.confirm-note{font-size:.88rem;color:var(--red);margin:.3rem 0}
.rules{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:.8rem 1rem}
.rules ol{padding-left:1.3rem;margin:.3rem 0}
.mysteps .ms{background:var(--sheet);border:1px solid var(--rule2);border-radius:var(--r-sm);padding:.5rem .7rem;margin-bottom:.5rem}
.mysteps pre{white-space:pre-wrap;font-family:var(--hand);margin:.3rem 0;font-size:.95rem}
.railtoggle{display:none}

/* ---------- pen ---------- */
.pen-canvas{position:fixed;inset:0;pointer-events:none;z-index:40}
.pen-canvas.active{pointer-events:auto;cursor:crosshair}
.pen-canvas.active.touchpass{touch-action:pan-x pan-y pinch-zoom}
.pen-canvas.active.swallow{touch-action:none}
.pen-bar{position:fixed;right:12px;bottom:12px;z-index:45;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r-md);
  padding:.35rem;display:flex;gap:.25rem;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 24px);box-shadow:0 2px 0 var(--ink)}
.pen-bar button{border:1.5px solid transparent;background:none;border-radius:6px;min-width:30px;height:30px;padding:0 .35rem;font-size:.85rem;color:var(--ink)}
.pen-bar button[aria-pressed="true"]{border-color:var(--ink);background:var(--hl)}
.pen-bar .sw{width:20px;height:20px;border-radius:50%;display:inline-block;vertical-align:middle;border:1.5px solid var(--ink)}
.pen-bar .tools{display:none;gap:.2rem;align-items:center;flex-wrap:wrap}

nchor=\"middle\">32<\/text><text x=\"128.0\" y=\"26\" class=\"bracet\" text-anchor=\"middle\">\u22121 (\u00d710)<\/text><circle cx=\"332.0\" cy=\"94\" r=\"6\" class=\"dot\"/><circle cx=\"332.0\" cy=\"80\" r=\"6\" class=\"dot\"/><circle cx=\"332.0\" cy=\"66\" r=\"6\" class=\"dot\"/><circle cx=\"332.0\" cy=\"52\" r=\"6\" class=\"dot\"/><circle cx=\"332.0\" cy=\"38\" r=\"6\" class=\"dot\"/><text x=\"332.0\" y=\"122\" class=\"dotlab\" text-anchor=\"middle\">34<\/text><text x=\"332.0\" y=\"26\" class=\"bracet\" text-anchor=\"middle\">+1 (\u00d711)<\/text><\/svg><\/div><figcaption><p>Balance check around 33: 11 women +1 each, 10 men \u22121 each: +1 over 21 people, so 33 1/21. \u2713<\/p><\/figcaption><\/figure><\/div><\/div><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "answer": "694/21 = 33 1/21 years", "check": "11 \u00d7 34 + 10 \u00d7 32 = 694 years over 21 people; 694/21 = 33 1/21 \u2248 33.05.", "concept": "c8", "inclass": "about 72:30", "above": false, "note": null, "figure": null}], "concepts": {"c1": "<h2>The Total box<\/h2><div class=\"eq\" role=\"math\">Total = mean \u00d7 count<\/div><p class=\"idea\">The mean is the equal share, so the Total box always holds mean \u00d7 count, and you can run it in either direction.<\/p><div class=\"story concept\" id=\"story9\" tabindex=\"0\" aria-label=\"The Total box story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 340 150\" role=\"img\" aria-label=\"unequal jars\" style=\"max-width:493px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"16\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"18\" y=\"85.14285714285714\" width=\"44\" height=\"42.85714285714286\" rx=\"4\" class=\"jar\"/><text x=\"40\" y=\"80.14285714285714\" class=\"jart\" text-anchor=\"middle\">30<\/text><rect x=\"76\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"78\" y=\"85.14285714285714\" width=\"44\" height=\"42.85714285714286\" rx=\"4\" class=\"jar\"/><text x=\"100\" y=\"80.14285714285714\" class=\"jart\" text-anchor=\"middle\">30<\/text><rect x=\"136\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"138\" y=\"63.71428571428571\" width=\"44\" height=\"64.28571428571429\" rx=\"4\" class=\"jar\"/><text x=\"160\" y=\"58.71428571428571\" class=\"jart\" text-anchor=\"middle\">45<\/text><rect x=\"196\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"198\" y=\"42.28571428571428\" width=\"44\" height=\"85.71428571428572\" rx=\"4\" class=\"jar\"/><text x=\"220\" y=\"37.28571428571428\" class=\"jart\" text-anchor=\"middle\">60<\/text><rect x=\"256\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"258\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"280\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">70<\/text><\/svg><\/div><figcaption><p>Five jars hold 30, 30, 45, 60 and 70 beans. What is the \u201caverage\u201d jar?<\/p><div class=\"ask\"><b>Ask him:<\/b> Which jar would you call average, and why?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 72 92\" role=\"img\" aria-label=\"tempting wrong answer\" style=\"max-width:104px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">45<\/text><line x1=\"6\" y1=\"60\" x2=\"66\" y2=\"12\" class=\"strike banned big\"/><text x=\"36.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">the middle jar, not an equal share<\/text><\/svg><\/div><figcaption><p>Tempting: 45, the jar in the middle. That&#x27;s a jar that already exists; it doesn&#x27;t share anything out.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 220 112\" role=\"img\" aria-label=\"bowl\" style=\"max-width:319px\" preserveAspectRatio=\"xMidYMid meet\"><path d=\"M20 26 Q110 136 200 26 Z\" class=\"bowl\"/><text x=\"110\" y=\"50\" class=\"calcn\" text-anchor=\"middle\">235<\/text><text x=\"110\" y=\"66\" class=\"cap\" text-anchor=\"middle\">beans in all<\/text><\/svg><\/div><figcaption><p>Pour all five into one bowl: 235 beans. Pouring changes where they are, not how many.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 340 150\" role=\"img\" aria-label=\"levelled jars\" style=\"max-width:493px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"16\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"18\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"40\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">47<\/text><rect x=\"76\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"78\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"100\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">47<\/text><rect x=\"136\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"138\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"160\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">47<\/text><rect x=\"196\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"198\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"220\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">47<\/text><rect x=\"256\" y=\"18\" width=\"48\" height=\"112\" rx=\"6\" class=\"jarglass\"/><rect x=\"258\" y=\"28.0\" width=\"44\" height=\"100.0\" rx=\"4\" class=\"jar\"/><text x=\"280\" y=\"23.0\" class=\"jart\" text-anchor=\"middle\">47<\/text><line x1=\"8\" y1=\"28.0\" x2=\"332\" y2=\"28.0\" class=\"levelline\"/><\/svg><\/div><figcaption><p>Share them back out: 235 \u00f7 5 = 47 in every jar. 47 is the mean.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 476 90\" role=\"img\" aria-label=\"jars as a slot line\" style=\"max-width:690px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">30<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">30<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">45<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">60<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">70<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"144\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"400.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">47 \u00d7 5 = 235<\/text><text x=\"400.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>The same thing as a slot line: one box per jar, and the Total box at the end, 47 \u00d7 5 = 235.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 418 90\" role=\"img\" aria-label=\"backwards\" style=\"max-width:606px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">85<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">92<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">95<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><text x=\"253\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"270\" y=\"22\" width=\"144\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"342.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">90 \u00d7 4 = 360<\/text><text x=\"342.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Run it backwards: four test scores average 90, three are 85, 92, 95. Total = 90 \u00d7 4 = 360, so the fourth is 360 \u2212 272 = 88.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why do we multiply first instead of dividing?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>mean<\/th><th>count<\/th><th>Total box<\/th><\/tr><\/thead><tbody><tr><td>47<\/td><td>5<\/td><td>235<\/td><\/tr><tr><td>90<\/td><td>4<\/td><td>360<\/td><\/tr><tr class=\"hl\"><td>6<\/td><td>7<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row yourself. Then the rule: Total = mean \u00d7 count, and mean = Total \u00f7 count.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c2": "<h2>Changing the line<\/h2><div class=\"eq\" role=\"math\">new mean = <span class=\"frac\"><span>new Total<\/span><span>new count<\/span><\/span><\/div><p class=\"idea\">When boxes are added, removed or changed, fix the Total box first, then divide by the new count.<\/p><div class=\"story concept\" id=\"story10\" tabindex=\"0\" aria-label=\"Changing the line story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 286 90\" role=\"img\" aria-label=\"2 4 6\" style=\"max-width:415px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><text x=\"195\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"212\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"247.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"247.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Start with 2, 4, 6: Total 12, three boxes, mean 4.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 344 90\" role=\"img\" aria-label=\"add the mean\" style=\"max-width:499px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><text x=\"253\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"270\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"305.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">16<\/text><text x=\"305.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Add a box holding 4, the mean. Total 16, four boxes: still 4. A jar that is already level needs no sharing.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why didn&#x27;t the mean move?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 280 92\" role=\"img\" aria-label=\"tempting wrong answer\" style=\"max-width:406px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"174\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"97.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">(4 + 12) \u00f7 2<\/text><text x=\"207.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"231\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"246.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">8<\/text><line x1=\"6\" y1=\"60\" x2=\"274\" y2=\"12\" class=\"strike banned big\"/><text x=\"140.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">averages the old mean with one new box<\/text><\/svg><\/div><figcaption><p>Now add 12 instead. Tempting: average the old mean and the new number, 8. That treats the three old boxes as if they were one box.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 344 90\" role=\"img\" aria-label=\"add 12\" style=\"max-width:499px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><text x=\"253\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"270\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"305.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">24<\/text><text x=\"305.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Do it with the Total box: 12 + 12 = 24, four boxes, 24 \u00f7 4 = 6.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 228 90\" role=\"img\" aria-label=\"remove 6\" style=\"max-width:331px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><text x=\"137\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"154\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"189.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"189.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Remove the 6 instead: Total 12 \u2212 6 = 6, two boxes, mean 3.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 286 90\" role=\"img\" aria-label=\"shift every box by 4\" style=\"max-width:415px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">10<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><text x=\"195\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"212\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"247.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">24<\/text><text x=\"247.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Add 4 to every box: the Total grows by 3 \u00d7 4 = 12, 24 \u00f7 3 = 8. Every box +4 makes the mean +4.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>change to 2, 4, 6<\/th><th>new Total<\/th><th>new count<\/th><th>new mean<\/th><\/tr><\/thead><tbody><tr><td>add 4<\/td><td>16<\/td><td>4<\/td><td>4<\/td><\/tr><tr><td>add 12<\/td><td>24<\/td><td>4<\/td><td>6<\/td><\/tr><tr><td>remove 6<\/td><td>6<\/td><td>2<\/td><td>3<\/td><\/tr><tr class=\"hl\"><td>add 0<\/td><td>?<\/td><td>?<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: change the Total box, change the count, then divide.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c3": "<h2>Totals of pieces<\/h2><div class=\"eq\" role=\"math\">(a + b) + (c + d) \u2212 (b + c) = a + d<\/div><p class=\"idea\">Group boxes into pieces whose totals you know, then add or subtract whole pieces.<\/p><div class=\"story concept\" id=\"story11\" tabindex=\"0\" aria-label=\"Totals of pieces story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 244 100\" role=\"img\" aria-label=\"a b c d\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">a<\/text><rect x=\"66\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">b<\/text><rect x=\"124\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">c<\/text><rect x=\"182\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">d<\/text><path d=\"M10 42 L10 35 L114 35 L114 42\" class=\"brace\"/><text x=\"62.0\" y=\"31\" class=\"bracet\" text-anchor=\"middle\">average 5<\/text><\/svg><\/div><figcaption><p>The average of a and b is 5, of b and c is 8, of c and d is 6. What is the average of a and d?<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><div class=\"vstack\"><svg class=\"pic \" viewBox=\"0 0 244 74\" role=\"img\" aria-label=\"one line\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">9<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">7<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">5<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 244 74\" role=\"img\" aria-label=\"another line\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><\/svg><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"tempting\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">find a, b, c, d first?<\/text><line x1=\"14\" y1=\"42\" x2=\"246\" y2=\"14\" class=\"strike banned big\"/><\/svg><\/div><\/div><figcaption><p>Tempting: find a, b, c and d first. But 1, 9, 7, 5 and 2, 8, 8, 4 both fit. The single boxes aren&#x27;t fixed.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 244 100\" role=\"img\" aria-label=\"averages to totals\" style=\"max-width:354px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">a<\/text><rect x=\"66\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">b<\/text><rect x=\"124\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">c<\/text><rect x=\"182\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">d<\/text><path d=\"M10 42 L10 35 L114 35 L114 42\" class=\"brace\"/><text x=\"62.0\" y=\"31\" class=\"bracet\" text-anchor=\"middle\">a + b = 10<\/text><\/svg><\/div><figcaption><p>Turn every average into a piece total: a + b = 10, b + c = 16, c + d = 12.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 254 92\" role=\"img\" aria-label=\"outside pieces\" style=\"max-width:368px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">+<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">12<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">22<\/text><text x=\"127.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">(a + b) + (c + d) = a + b + c + d<\/text><\/svg><\/div><figcaption><p>Add the two outside pieces: that&#x27;s all four boxes, 22.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 241 92\" role=\"img\" aria-label=\"remove the middle piece\" style=\"max-width:349px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">22<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">16<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"31\" height=\"40\" rx=\"7\" class=\"result\"/><text x=\"207.5\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">6<\/text><text x=\"120.5\" y=\"86\" class=\"cap\" text-anchor=\"middle\">take away b + c, leaving a + d<\/text><\/svg><\/div><figcaption><p>Take away the middle piece b + c: a + d = 6, so their average is 3. Both lines above give 6.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 460 100\" role=\"img\" aria-label=\"alternating pairs\" style=\"max-width:667px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><rect x=\"66\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">\u22122<\/text><rect x=\"124\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">3<\/text><rect x=\"182\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">\u22124<\/text><rect x=\"240\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">5<\/text><rect x=\"298\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"323.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">\u22126<\/text><path d=\"M10 42 L10 35 L114 35 L114 42\" class=\"brace\"/><text x=\"62.0\" y=\"31\" class=\"bracet\" text-anchor=\"middle\">\u22121<\/text><text x=\"369\" y=\"77\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"386\" y=\"48\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"421.0\" y=\"76\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">\u22123<\/text><\/svg><\/div><figcaption><p>Pieces also tame long lines: 1, \u22122, 3, \u22124, 5, \u22126. Each neighbour pair adds to \u22121; three pairs make \u22123; six boxes, so the mean is \u22123 \u00f7 6 = \u22121/2.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why divide by 6 and not by 3?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>pieces you know<\/th><th>what you can build<\/th><\/tr><\/thead><tbody><tr><td>a + b, c + d<\/td><td>a + b + c + d<\/td><\/tr><tr><td>a + b + c + d and b + c<\/td><td>a + d<\/td><\/tr><tr class=\"hl\"><td>a + b and a + b + c<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: you only need the piece the question asks for, not every box.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c4": "<h2>The middle box<\/h2><div class=\"eq\" role=\"math\">odd count n: box <span class=\"frac\"><span>n + 1<\/span><span>2<\/span><\/span> &nbsp;&nbsp; even count: average of boxes <span class=\"frac\"><span>n<\/span><span>2<\/span><\/span> and <span class=\"frac\"><span>n<\/span><span>2<\/span><\/span> + 1<\/div><p class=\"idea\">Sort first; an odd line has one middle box, an even line has a middle pair whose average is the median.<\/p><div class=\"story concept\" id=\"story12\" tabindex=\"0\" aria-label=\"The middle box story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 302 90\" role=\"img\" aria-label=\"unsorted line\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">20<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">11<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">15<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><\/svg><\/div><figcaption><p>Five numbers as given: 2, 8, 20, 11, 15. Box 3 holds 20\u2026<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"tempting\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">median = 20?<\/text><line x1=\"14\" y1=\"42\" x2=\"246\" y2=\"14\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: 20. But the line isn&#x27;t in order, so box 3 isn&#x27;t the middle of anything.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 302 90\" role=\"img\" aria-label=\"sorted line\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">8<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">11<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">15<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">20<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><\/svg><\/div><figcaption><p>Sort first: 2, 8, 11, 15, 20. Now box 3 has two boxes on each side. The median is 11.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why must we sort before finding the middle?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 116\" role=\"img\" aria-label=\"even line\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><text x=\"33.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"91.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"149.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"207.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"265.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">5<\/text><rect x=\"298\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"323.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"323.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">6<\/text><path d=\"M126 42 L126 35 L230 35 L230 42\" class=\"brace\"/><text x=\"178.0\" y=\"31\" class=\"bracet\" text-anchor=\"middle\">(2 + 4) \u00f7 2 = 3<\/text><\/svg><\/div><figcaption><p>Six boxes have no single middle: boxes 3 and 4 share it. (2 + 4) \u00f7 2 = 3, and 3 isn&#x27;t even in the list.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 360 116\" role=\"img\" aria-label=\"even line with repeats\" style=\"max-width:522px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><text x=\"33.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"91.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"149.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"207.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"265.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">5<\/text><rect x=\"298\" y=\"48\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"323.0\" y=\"76\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"323.0\" y=\"108\" class=\"posn\" text-anchor=\"middle\">6<\/text><path d=\"M126 42 L126 35 L230 35 L230 42\" class=\"brace\"/><text x=\"178.0\" y=\"31\" class=\"bracet\" text-anchor=\"middle\">(2 + 2) \u00f7 2 = 2<\/text><\/svg><\/div><figcaption><p>Change it to 1, 2, 2, 2, 4, 6: the middle pair is 2 and 2, so the median is 2.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 302 90\" role=\"img\" aria-label=\"outlier\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">4<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">5<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">5<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">6<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">200<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><\/svg><\/div><figcaption><p>A huge last box doesn&#x27;t move the middle box: 4, 5, 5, 6, 200 still has median 5. The middle box cares about position, not size.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>boxes<\/th><th>middle box(es)<\/th><\/tr><\/thead><tbody><tr><td>5<\/td><td>3<\/td><\/tr><tr><td>6<\/td><td>3 and 4<\/td><\/tr><tr><td>7<\/td><td>4<\/td><\/tr><tr><td>20<\/td><td>10 and 11<\/td><\/tr><tr class=\"hl\"><td>8<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: sort, then box (n + 1) \u00f7 2 for odd n, or the average of boxes n \u00f7 2 and n \u00f7 2 + 1 for even n.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c5": "<h2>Push to the extreme<\/h2><div class=\"eq\" role=\"math\">biggest box = Total \u2212 (every other box, as small as allowed)<\/div><p class=\"idea\">To make one box as big as possible, make every other box as small as the rules allow, and the other way round.<\/p><div class=\"story concept\" id=\"story13\" tabindex=\"0\" aria-label=\"Push to the extreme story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 456 90\" role=\"img\" aria-label=\"five different positive integers\" style=\"max-width:661px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">10<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"124\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"390.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:16px\">9 \u00d7 5 = 45<\/text><text x=\"390.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Five different positive whole numbers, median 10, mean 9. How big can the biggest be? Total 45, box 3 is 10.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 254 92\" role=\"img\" aria-label=\"tempting wrong answer\" style=\"max-width:368px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"10\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"32.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">45<\/text><text x=\"77.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">\u2212<\/text><rect x=\"101\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"123.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">10<\/text><text x=\"168.5\" y=\"44\" class=\"op\" text-anchor=\"middle\">=<\/text><rect x=\"192\" y=\"16\" width=\"44\" height=\"40\" rx=\"7\" class=\"numbox\"/><text x=\"214.0\" y=\"43\" class=\"calcn\" text-anchor=\"middle\">35<\/text><line x1=\"6\" y1=\"60\" x2=\"248\" y2=\"12\" class=\"strike banned big\"/><text x=\"127.0\" y=\"86\" class=\"cap\" text-anchor=\"middle\">forgets three boxes<\/text><\/svg><\/div><figcaption><p>Tempting: 45 \u2212 10 = 35. That leaves boxes 1, 2 and 4 empty, but they must hold something.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 402 90\" role=\"img\" aria-label=\"push the others down\" style=\"max-width:583px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">10<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">11<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">?<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"363.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">45<\/text><text x=\"363.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Push the other boxes as small as the rules allow: different positive numbers, so 1 and 2 below 10, and 11 just above.<\/p><div class=\"ask\"><b>Ask him:<\/b> Why can&#x27;t box 4 be 10?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 402 90\" role=\"img\" aria-label=\"biggest is 21\" style=\"max-width:583px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">1<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">2<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">10<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">11<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">21<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"363.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">45<\/text><text x=\"363.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Then the biggest is 45 \u2212 1 \u2212 2 \u2212 10 \u2212 11 = 21.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 402 90\" role=\"img\" aria-label=\"smallest biggest\" style=\"max-width:583px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">3<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">9<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">10<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">11<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"result\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">12<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><text x=\"311\" y=\"51\" class=\"op\" text-anchor=\"middle\">\u2192<\/text><rect x=\"328\" y=\"22\" width=\"70\" height=\"44\" rx=\"7\" class=\"result totalbox\"/><text x=\"363.0\" y=\"50\" class=\"calcn\" text-anchor=\"middle\" style=\"font-size:18px\">45<\/text><text x=\"363.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">Total<\/text><\/svg><\/div><figcaption><p>Push the other way to make the biggest small: boxes 4 and 5 as close as possible (11 and 12), and the low boxes take the rest, like 3 and 9. The biggest can be as small as 12.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>to make this\u2026<\/th><th>push these\u2026<\/th><\/tr><\/thead><tbody><tr><td>biggest box large<\/td><td>every other box small<\/td><\/tr><tr><td>biggest box small<\/td><td>lower boxes large, top boxes close together<\/td><\/tr><tr class=\"hl\"><td>box 2 large<\/td><td>?<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>Fill the last row. Rule: one box goes up exactly as far as the others can go down.<\/p><\/figcaption><\/figure><div class=\"story-ctl\"><span class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"back\">\u2190 Back<\/button> <button type=\"button\" class=\"btn primary\" data-act=\"next\">Next step \u2192<\/button><\/span><span class=\"dots\" role=\"group\" aria-label=\"Pictures\"><\/span><label><input type=\"checkbox\" class=\"showall\"> Show all steps<\/label><\/div><\/div>", "c6": "<h2>The tally<\/h2><div class=\"eq\" role=\"math\">mode = the value that fills the most boxes<\/div><p class=\"idea\">The mode is the value with the tallest stack in the tally; \u201cunique mode\u201d means one stack is strictly the tallest.<\/p><div class=\"story concept\" id=\"story14\" tabindex=\"0\" aria-label=\"The tally story\"><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 302 90\" role=\"img\" aria-label=\"jars as boxes\" style=\"max-width:438px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"8\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"33.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">30<\/text><text x=\"33.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">1<\/text><rect x=\"66\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"91.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">30<\/text><text x=\"91.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">2<\/text><rect x=\"124\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"149.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">45<\/text><text x=\"149.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">3<\/text><rect x=\"182\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"207.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">60<\/text><text x=\"207.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">4<\/text><rect x=\"240\" y=\"22\" width=\"50\" height=\"44\" rx=\"7\" class=\"slot\"/><text x=\"265.0\" y=\"50\" class=\"slotn\" text-anchor=\"middle\" style=\"font-size:18px\">70<\/text><text x=\"265.0\" y=\"82\" class=\"posn\" text-anchor=\"middle\">5<\/text><\/svg><\/div><figcaption><p>The jar line again: 30, 30, 45, 60, 70. Which value is the mode?<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 260 56\" role=\"img\" aria-label=\"tempting\" style=\"max-width:377px\" preserveAspectRatio=\"xMidYMid meet\"><rect x=\"4\" y=\"4\" width=\"252\" height=\"48\" rx=\"10\" class=\"wcard \"/><text x=\"130.0\" y=\"32\" class=\"cardt\" text-anchor=\"middle\">mode = 70?<\/text><line x1=\"14\" y1=\"42\" x2=\"246\" y2=\"14\" class=\"strike banned big\"/><\/svg><\/div><figcaption><p>Tempting: 70, the biggest. But the mode is about how often, not how big.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 214 104\" role=\"img\" aria-label=\"tally of jars\" style=\"max-width:310px\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"8\" y1=\"70\" x2=\"206\" y2=\"70\" class=\"axis\"/><rect x=\"10\" y=\"22\" width=\"28\" height=\"44\" rx=\"6\" class=\"shade\"/><circle cx=\"24\" cy=\"54\" r=\"7\" class=\"dot\"/><circle cx=\"24\" cy=\"34\" r=\"7\" class=\"dot\"/><line x1=\"24\" y1=\"66\" x2=\"24\" y2=\"74\" class=\"axis\"/><text x=\"24\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">30<\/text><circle cx=\"70\" cy=\"54\" r=\"7\" class=\"dot\"/><line x1=\"70\" y1=\"66\" x2=\"70\" y2=\"74\" class=\"axis\"/><text x=\"70\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">45<\/text><circle cx=\"116\" cy=\"54\" r=\"7\" class=\"dot\"/><line x1=\"116\" y1=\"66\" x2=\"116\" y2=\"74\" class=\"axis\"/><text x=\"116\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">60<\/text><circle cx=\"162\" cy=\"54\" r=\"7\" class=\"dot\"/><line x1=\"162\" y1=\"66\" x2=\"162\" y2=\"74\" class=\"axis\"/><text x=\"162\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">70<\/text><\/svg><\/div><figcaption><p>Stack one dot over each value for every box it fills. 30&#x27;s stack is tallest: the mode is 30.<\/p><div class=\"ask\"><b>Ask him:<\/b> What does the height of a stack count?<\/div><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 352 124\" role=\"img\" aria-label=\"two modes\" style=\"max-width:510px\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"8\" y1=\"90\" x2=\"344\" y2=\"90\" class=\"axis\"/><circle cx=\"24\" cy=\"74\" r=\"7\" class=\"dot\"/><line x1=\"24\" y1=\"86\" x2=\"24\" y2=\"94\" class=\"axis\"/><text x=\"24\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">1<\/text><circle cx=\"70\" cy=\"74\" r=\"7\" class=\"dot\"/><line x1=\"70\" y1=\"86\" x2=\"70\" y2=\"94\" class=\"axis\"/><text x=\"70\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">2<\/text><rect x=\"102\" y=\"22\" width=\"28\" height=\"64\" rx=\"6\" class=\"shade\"/><circle cx=\"116\" cy=\"74\" r=\"7\" class=\"dot\"/><circle cx=\"116\" cy=\"54\" r=\"7\" class=\"dot\"/><circle cx=\"116\" cy=\"34\" r=\"7\" class=\"dot\"/><line x1=\"116\" y1=\"86\" x2=\"116\" y2=\"94\" class=\"axis\"/><text x=\"116\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">4<\/text><circle cx=\"162\" cy=\"74\" r=\"7\" class=\"dot\"/><line x1=\"162\" y1=\"86\" x2=\"162\" y2=\"94\" class=\"axis\"/><text x=\"162\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">5<\/text><circle cx=\"208\" cy=\"74\" r=\"7\" class=\"dot\"/><circle cx=\"208\" cy=\"54\" r=\"7\" class=\"dot\"/><line x1=\"208\" y1=\"86\" x2=\"208\" y2=\"94\" class=\"axis\"/><text x=\"208\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">6<\/text><rect x=\"240\" y=\"22\" width=\"28\" height=\"64\" rx=\"6\" class=\"shade\"/><circle cx=\"254\" cy=\"74\" r=\"7\" class=\"dot\"/><circle cx=\"254\" cy=\"54\" r=\"7\" class=\"dot\"/><circle cx=\"254\" cy=\"34\" r=\"7\" class=\"dot\"/><line x1=\"254\" y1=\"86\" x2=\"254\" y2=\"94\" class=\"axis\"/><text x=\"254\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">7<\/text><circle cx=\"300\" cy=\"74\" r=\"7\" class=\"dot\"/><line x1=\"300\" y1=\"86\" x2=\"300\" y2=\"94\" class=\"axis\"/><text x=\"300\" y=\"110\" class=\"dotlab\" text-anchor=\"middle\">8<\/text><\/svg><\/div><figcaption><p>1, 2, 4, 4, 4, 5, 6, 6, 7, 7, 7, 8: two stacks tie for tallest. The modes are 4 and 7.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><svg class=\"pic \" viewBox=\"0 0 168 104\" role=\"img\" aria-label=\"tie\" style=\"max-width:244px\" preserveAspectRatio=\"xMidYMid meet\"><line x1=\"8\" y1=\"70\" x2=\"160\" y2=\"70\" class=\"axis\"/><rect x=\"10\" y=\"22\" width=\"28\" height=\"44\" rx=\"6\" class=\"shade\"/><circle cx=\"24\" cy=\"54\" r=\"7\" class=\"dot\"/><circle cx=\"24\" cy=\"34\" r=\"7\" class=\"dot\"/><line x1=\"24\" y1=\"66\" x2=\"24\" y2=\"74\" class=\"axis\"/><text x=\"24\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">2<\/text><rect x=\"56\" y=\"22\" width=\"28\" height=\"44\" rx=\"6\" class=\"shade\"/><circle cx=\"70\" cy=\"54\" r=\"7\" class=\"dot\"/><circle cx=\"70\" cy=\"34\" r=\"7\" class=\"dot\"/><line x1=\"70\" y1=\"66\" x2=\"70\" y2=\"74\" class=\"axis\"/><text x=\"70\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">6<\/text><circle cx=\"116\" cy=\"54\" r=\"7\" class=\"dot\"/><line x1=\"116\" y1=\"66\" x2=\"116\" y2=\"74\" class=\"axis\"/><text x=\"116\" y=\"90\" class=\"dotlab\" text-anchor=\"middle\">8<\/text><\/svg><\/div><figcaption><p>\u201cUnique mode\u201d rules out ties. In 2, 2, 6, 6, 8 no stack is strictly tallest, so there is no unique mode.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>statistic<\/th><th>for 30, 30, 45, 60, 70<\/th><th>comes from<\/th><\/tr><\/thead><tbody><tr><td>mean<\/td><td>47<\/td><td>the Total box<\/td><\/tr><tr><td>median<\/td><td>45<\/td><td>the middle box<\/td><\/tr><tr><td>mode<\/td><td>30<\/td><td>the tally<\/td><\/tr><\/tbody><\/table><\/div><figcaption><p>One line, three different questions, three different answers.<\/p><\/figcaption><\/figure><figure class=\"frame\"><div class=\"pic-wrap\"><table class=\"ptable \"><thead><tr><th>list<\/th><th>tallest stack<\/th><th>mode<\/th><\/tr><\/thead><tbody><tr><td>30, 30, 45, 60, 70<\/td><td>2 dots<\/td><td>30<\/td><\/tr><tr class=\"hl\"><td>5, 1, 5, 2, 1, 5<\/td><td>?<\/td><td>?<\/
